set timeout=10

loadfont unicode

# Graphical menu (theme: boot/grub/themes/wildwired). Ubuntu's signed EFI
# GRUB has gfxterm, gfxmenu and png built in; BIOS loads them from
# i386-pc/. If graphics fail, the text menu below still works.
set gfxmode=auto
insmod gfxterm
insmod png
if [ "$grub_platform" = "pc" ]; then insmod all_video; fi
if terminal_output gfxterm; then
    loadfont /boot/grub/themes/wildwired/sans-22.pf2
    loadfont /boot/grub/themes/wildwired/sans-18.pf2
    loadfont /boot/grub/themes/wildwired/mono-16.pf2
    set theme=/boot/grub/themes/wildwired/theme.txt
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Try or install Wild & Wired OS" {
    set gfxpayload=keep
    linux  /casper/vmlinuz  --- quiet splash
    initrd /casper/initrd
}
menuentry "Wild & Wired OS (safe graphics)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz nomodeset  --- quiet splash
    initrd /casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
fi
