# Wild & Wired OS — sponsor & thanks data. THE single source for wallpapers,
# lock screen, SDDM, installer slideshow, welcome app, print sheet, and disc
# art. Edit this, run render-sponsors.py, repack with build.sh --from-stage
# assets. See docs/ART-FREEZE.md for the freeze date.
#
# tier: presenting | gold | silver | community | in-kind | media-partner | special-thanks
#   = the event's Root | Sudo | Package Maintainer | Community Contributor | in kind,
#     then Media Partner and Special Thanks (logos; plain names go in thanks: below)
# logo: path to PNG/SVG-exported-PNG, transparent background preferred,
#       >= 640 px wide (>= 1000 for silver and up). Logos are never enlarged,
#       so a smaller file shows smaller than its neighbours on the 4K
#       wallpaper and the print sheet. Omit to have the name typeset instead.
# display_name_override: use when the legal name shouldn't be the shown name.
# sort_order: lower sorts first within a tier (default 100).

# Taken from wildandwiredwv.com 2026-11-09 (homepage and /sponsors/ agree),
# in the site's order. Logos are the site's web copies; swap in originals
# when available.
# *-onlight.png are dark versions of white logos, from logo-onlight.py.
