# Wild & Wired OS: boot menus show our name. Only grub-mkconfig sees it.
# Everything else, including grub-install, keeps GRUB_DISTRIBUTOR=Ubuntu from
# /etc/default/grub, because grub-install names the EFI folder after the
# first word of this value and every machine should stay on /EFI/ubuntu.
case "$0" in *grub-mkconfig*) GRUB_DISTRIBUTOR="Wild & Wired OS" ;; esac
